services:
  dayfold:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      DATA_DIR: /app/data
      OUTBOX_DIR: /app/outbox
    volumes:
      # named volumes keep the right ownership for the non-root container user
      - dayfold-data:/app/data
      - dayfold-outbox:/app/outbox

volumes:
  dayfold-data:
  dayfold-outbox:
